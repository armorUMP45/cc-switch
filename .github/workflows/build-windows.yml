name: Build Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
      - run: pnpm install --frozen-lockfile
      - name: Remove updater config to skip signing
        shell: pwsh
        run: |
          $json = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $json.PSObject.Properties.Remove('updater')
          $json | ConvertTo-Json -Depth 10 | Set-Content src-tauri\tauri.conf.json
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows
          path: src-tauri\target\release\bundle\msi\*.msi
